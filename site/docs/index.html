<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Lodestar documentation: install it, run your first team of agents, and every command and flag.">
  <title>Lodestar docs</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="docs.css?v=8">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="docs.js?v=7" defer></script>
  <script src="../script.js?v=24" defer></script>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <header class="bar">
    <button class="menu" type="button" aria-label="Open the page list" aria-expanded="false" aria-controls="side">
      <span></span><span></span><span></span>
    </button>
    <a class="logo" href="../"><span class="logo-dot" aria-hidden="true"></span>lodestar <span class="logo-tag">docs</span></a>
    <div class="search" role="search">
      <input id="q" type="search" placeholder="Search the docs" autocomplete="off" spellcheck="false" aria-label="Search the docs" aria-controls="results">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <ol id="results" class="results" hidden></ol>
    </div>
    <nav class="bar-links" aria-label="Elsewhere">
      <a href="../">Home</a>
      <a href="https://github.com/zenodea/lodestar">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <div class="layout">
    <aside class="side" id="side" aria-label="Documentation pages"></aside>
    <main class="page">
      <article id="doc" class="doc" aria-live="polite">
        <noscript><p>These docs need JavaScript to render. The same pages are plain markdown in <a href="https://github.com/zenodea/lodestar/tree/main/site/docs/pages">the repository</a>.</p></noscript>
      </article>
      <nav class="pager" id="pager" aria-label="Previous and next page"></nav>
      <p class="edit" id="edit"></p>
    </main>
    <aside class="toc" id="toc" aria-label="On this page"></aside>
  </div>
  <div class="scrim" hidden></div>
</body>
</html>
